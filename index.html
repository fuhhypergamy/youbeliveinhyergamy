<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="One question. Two answers. Do you believe in hypergamy?">
  <meta property="og:title" content="Do You Believe in Hypergamy?">
  <meta property="og:description" content="One question. Choose your answer.">
  <meta property="og:type" content="website">
  <title>Do You Believe in Hypergamy?</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #11131b;
      color: #f7f4ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 12px;
      background:
        radial-gradient(ellipse at 50% 0%, #492b4d 0, transparent 48%),
        radial-gradient(ellipse at 90% 100%, #222b46 0, transparent 45%),
        #11131b;
    }

    main {
      width: min(100%, 620px);
      height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 2vh, 18px);
    }

    .scale-art {
      width: min(100%, 300px);
      height: min(29dvh, 250px);
      min-height: 150px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #ffffff24;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 48px #0005;
    }

    .scale-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 5vh, 38px) clamp(20px, 6vw, 44px);
      border: 1px solid #ffffff24;
      border-radius: 28px;
      background: #181a24eF;
      box-shadow: 0 28px 100px #0008;
      text-align: center;
    }

    .brand {
      margin: 0 0 22px;
      color: #d7a4e7;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.7rem);
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    .intro {
      max-width: 390px;
      margin: 16px auto 0;
      color: #c1bdca;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .notice {
      max-width: 390px;
      margin: 18px auto 0;
      color: #f1c982;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      min-width: 138px;
      min-height: 50px;
      padding: 12px 24px;
      border: 1px solid transparent;
      border-radius: 999px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #f1c982;
      outline-offset: 4px;
    }

    .answer {
      background: #d7a4e7;
      color: #211426;
    }

    .answer:hover {
      background: #e4b7f1;
    }

    .answer.secondary {
      border-color: #51465a;
      background: #24232d;
      color: #f7f4ef;
    }

    .answer.secondary:hover {
      background: #312d39;
    }

    .result {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #000;
      box-shadow: none;
      text-align: center;
    }

    .result[hidden] {
      display: none;
    }

    .jump-scare-video {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      margin: 0;
      border-radius: 0;
      background: #000;
      object-fit: cover;
    }

    .playback-message {
      position: absolute;
      z-index: 1;
      right: 16px;
      bottom: 16px;
      left: 16px;
      max-width: 100%;
      margin: 0;
      color: #fff;
      text-shadow: 0 1px 5px #000;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <figure class="scale-art">
      <img src="hypergamy-scale.png" alt="Hypergamy infographic illustrating partner preference diagrams">
    </figure>
    <section class="card" id="question">
      <p class="brand">youbeliveinhyergamy</p>
      <h1>Do you believe in hypergamy?</h1>
      <p class="intro">Pick a side. Your answer is just for fun.</p>
      <div class="actions">
        <button class="answer" id="yes" type="button">Yes</button>
        <button class="answer secondary" id="no" type="button">No</button>
      </div>
    </section>

    <section class="card result" id="surprise" aria-live="polite" hidden>
      <video
        class="jump-scare-video"
        id="jump-scare-video"
        loop
        playsinline
        preload="auto"
        controlslist="nodownload noplaybackrate noremoteplayback"
        disablepictureinpicture
        disableremoteplayback
      >
        <source src="jumpscare-long.mp4" type="video/mp4">
        Your browser does not support HTML video.
      </video>
      <p class="notice" id="playback-message" role="status"></p>
    </section>
  </main>

  <script>
    const question = document.getElementById("question");
    const surprise = document.getElementById("surprise");
    const video = document.getElementById("jump-scare-video");
    const playbackMessage = document.getElementById("playback-message");

    function showSurprise() {
      question.hidden = true;
      surprise.hidden = false;
      playbackMessage.textContent = "";
      video.controls = false;
      video.loop = true;
      video.currentTime = 0;
      video.muted = false;
      video.volume = 1;

      let fullscreenRequest;
      try {
        if (document.documentElement.requestFullscreen) {
          fullscreenRequest = document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
          fullscreenRequest = Promise.resolve();
        } else {
          fullscreenRequest = Promise.reject(new Error("Fullscreen unavailable"));
        }
      } catch (error) {
        fullscreenRequest = Promise.reject(error);
      }

      video.play().catch(() => {
        playbackMessage.textContent =
          "The video couldn't start. Please reload the page and try again.";
      });

      Promise.resolve(fullscreenRequest).catch(() => {
        // Keep the full-page video visible when native fullscreen is unavailable.
      });
    }

    document.getElementById("yes").addEventListener("click", showSurprise);
    document.getElementById("no").addEventListener("click", showSurprise);
  </script>
</body>
</html>
